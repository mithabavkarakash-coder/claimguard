name: ClaimGuard CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-test-lint:
    name: ClaimGuard Rust & React Build, Lint, Test & Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Cargo Format Check
        run: cargo fmt --check

      - name: Cargo Build Workspace
        run: cargo build --workspace --verbose

      - name: Compile Compact Smart Contract & ZK Circuits via CLI
        run: cargo run -p claimguard-cli -- compile

      - name: Run Rust Integration Test Suite
        run: cargo test --workspace --verbose

      - name: Run Clippy Linter (-D warnings)
        run: cargo clippy --workspace -- -D warnings

      - name: Install Frontend Dependencies
        run: npm --prefix frontend install

      - name: Run Frontend TypeScript Typecheck
        run: npm --prefix frontend exec tsc -- -p tsconfig.json

      - name: Build Frontend React Bundle
        run: npm --prefix frontend run build
