[workspace]
resolver = "2"
members = [
    "claimguard-cli",
    "claimguard-indexer",
    "claimguard-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Stellar Pharma Chain (SPC) Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", default-features = false, features = ["std", "derive", "help", "usage"] }
hex = "0.4"
